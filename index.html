<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wishlist</title>
<style>
  :root { --primary:#0E6D68; --accent:#FF8A4A; --bg:#F4F7F6; --text:#12221F; --muted:#5B6B68; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:420px; padding:32px 24px; text-align:center; }
  .logo { width:72px; height:72px; border-radius:18px; background:var(--primary); margin:0 auto 20px;
          display:flex; align-items:center; justify-content:center; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { color:var(--muted); line-height:1.5; margin:0 0 24px; }
  .btn { display:block; width:100%; padding:16px; border-radius:12px; font-size:17px; font-weight:600;
         text-decoration:none; background:var(--accent); color:var(--text); }
  .note { font-size:14px; margin-top:20px; }
  .en { font-size:13px; margin-top:28px; opacity:.8; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-3-6-3-6-.5S10 8 12 8zm0 0c2-3 6-3 6-.5S14 8 12 8z"/></svg>
  </div>
  <h1 id="title">Wishlist</h1>
  <p id="text">Norų sąrašai draugams. Programėlė šiuo metu testuojama.</p>
  <a id="open" class="btn" href="#" hidden>Atidaryti Wishlist</a>
  <p id="note" class="note" hidden>Neturi programėlės? Paprašyk draugo, kuris tave pakvietė, atsiųsti programėlę. Kol kas ji testuojama.</p>
  <p id="en" class="en" hidden></p>
</main>
<script>
  (function () {
    var path = location.pathname.replace(/\/+$/, '');
    var m = path.match(/\/(invite|l)\/([A-Za-z0-9_-]+)$/);
    if (!m) return;
    var kind = m[1], id = m[2];
    var host = kind === 'invite' ? 'invite' : 'list';
    var appLink = 'wishlist://' + host + '/' + id;
    var isAndroid = /Android/i.test(navigator.userAgent);
    var href = isAndroid
      ? 'intent://' + host + '/' + id + '#Intent;scheme=wishlist;package=lt.ekinzinerija.wishlist;end'
      : appLink;
    var t = document.getElementById('title'), x = document.getElementById('text'),
        b = document.getElementById('open'), n = document.getElementById('note'), e = document.getElementById('en');
    document.title = kind === 'invite' ? 'Kvietimas į Wishlist' : 'Wishlist sąrašas';
    t.textContent = kind === 'invite' ? 'Tave kviečia į Wishlist' : 'Norų sąrašas Wishlist';
    x.textContent = kind === 'invite'
      ? 'Atidaryk programėlę ir tapsite draugais – matysite vienas kito norų sąrašus.'
      : 'Atidaryk programėlę ir pamatysi šį norų sąrašą.';
    e.textContent = kind === 'invite'
      ? "You've been invited to Wishlist. Open the app to accept."
      : 'Open the Wishlist app to see this wish list.';
    b.href = href; b.hidden = false; n.hidden = false; e.hidden = false;
  })();
</script>
</body>
</html>
